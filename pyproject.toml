[project]
name = "multi-agent-epsilon"
version = "0.1.0"
description = "Evidence-first security harness and isolated authorization fixture"
requires-python = ">=3.12,<3.13"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers --tb=short"
markers = ["integration: requires the isolated PostgreSQL fixture"]
