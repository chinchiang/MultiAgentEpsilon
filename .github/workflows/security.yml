name: Security pilot

on:
  push:
    branches: [main]
  pull_request_target:
    branches: [main]
    # edited 用於改 base 的重評估；不可在 job 層級略過：略過的同名檢查會被規則集當成通過。 / edited covers base
    # retargeting. Never skip it at job level: a skipped same-name check would satisfy the ruleset.
    types: [opened, synchronize, reopened, ready_for_review, edited]
  workflow_dispatch:
    inputs:
      candidate_sha:
        description: 'Optional immutable candidate SHA; evaluator comes from the selected workflow ref'
        required: false
        type: string

permissions:
  contents: read
  pull-requests: read
  actions: read

concurrency:
  # 依事件區分，避免手動執行取消 main 可信 push。 / The event keeps a manual evaluation from cancelling the trusted push run on main.
  group: trusted-security-${{ github.event_name }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  trusted-security-pilot:
    # 手動執行使用維護者選擇的 ref（可能就是候選）， / A manual run evaluates a maintainer-selected ref (possibly the candidate
    # 因此不可使用正式必要檢查名稱。 / itself), so it must never report under the required check name.
    name: ${{ github.event_name == 'workflow_dispatch' && 'manual-security-evaluation' || 'trusted-security-evaluation' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    outputs:
      evidence-digest: ${{ steps.evidence.outputs.artifact-digest }}
    steps:
      - name: Checkout evaluator from trusted base
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          path: trusted
          ref: ${{ github.event.pull_request.base.sha || github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: Checkout candidate as data only
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          path: candidate
          # 候選 checkout 只當資料，執行限於受限 runtime。 / Candidate checkout is data only; execution stays in the restricted runtime.
          allow-unsafe-pr-checkout: true
          ref: ${{ github.event.pull_request.head.sha || inputs.candidate_sha || github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: Set Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'
      - name: Record evaluator-owned CI provenance
        env:
          PR_NUMBER: ${{ github.event.pull_request.number || 0 }}
        run: python -I trusted/scripts/write_ci_provenance.py
      - name: Check protected changes and exact-head independent approval
        if: github.event_name == 'pull_request_target'
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          GH_TOKEN: ${{ github.token }}
        run: python -I trusted/scripts/check_trusted_changes.py --base "$BASE_SHA" --candidate candidate --pr "$PR_NUMBER" --output audit/trusted-guard.json
      - name: Install only evaluator dependencies
        working-directory: trusted
        run: python -I scripts/bootstrap.py
      - name: Install verified property-test tools / 安裝已驗證性質測試工具
        working-directory: trusted
        run: python -I scripts/install_test_tools.py
      - name: Build offline runtime from trusted wheels
        working-directory: trusted
        run: python -I scripts/build_runtime.py
      - name: Start evaluator regression database
        working-directory: trusted
        run: python -I scripts/dev_db.py start
      - name: Bilingual documentation checks / 雙語文件檢查
        working-directory: trusted
        run: python -I scripts/check_docs.py
      - name: Candidate documentation checks / 候選文件檢查
        working-directory: trusted
        # 只讀取候選文件與 Python 語法樹，不執行候選程式。 / Reads candidate documents and Python syntax trees; never executes them.
        run: python -I scripts/check_docs.py --root ../candidate
      - name: Evaluator regressions and isolation adversarial checks
        working-directory: trusted
        run: .venv/bin/python -m pytest --junitxml=artifacts/pytest.xml
      - name: Prove seeded defect still blocks
        working-directory: trusted
        run: .venv/bin/python -I scripts/expect_block.py
      - name: Evaluate candidate through external oracle
        working-directory: trusted
        run: .venv/bin/python -I scripts/run_security.py --candidate ../candidate
      - name: Self-check evidence against the publisher contract
        working-directory: trusted
        env:
          PR_NUMBER: ${{ github.event.pull_request.number || 0 }}
        run: .venv/bin/python -I scripts/check_publishable_evidence.py --candidate ../candidate --output ../audit/publishable-evidence.json
      - name: Remove evaluator regression database
        if: always()
        working-directory: trusted
        run: python -I scripts/dev_db.py stop
      - name: Reap cancelled security runs
        if: always()
        working-directory: trusted
        run: |
          if [ -x .venv/bin/python ]; then
            .venv/bin/python -I scripts/cleanup_runs.py
          fi
      - name: Retain evaluator-owned evidence
        id: evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ${{ github.event_name == 'workflow_dispatch' && 'manual-security' || 'trusted-security' }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            trusted/artifacts/
            audit/
          retention-days: 7
          if-no-files-found: error

  mutation-tests:
    # 突變測試有自己的 20 分鐘期限，獨立 job 避免耗盡評估工作的時間。 / The mutation campaign has its own
    # 20-minute deadline; a separate job keeps it from exhausting the evaluator's budget.
    name: ${{ github.event_name == 'workflow_dispatch' && 'manual-mutation-tests' || 'trusted-mutation-tests' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      # 只突變可信基準本身，不取得候選或任何憑證。 / Mutates only the trusted baseline; no candidate or credentials.
      - name: Checkout evaluator from trusted base
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          path: trusted
          ref: ${{ github.event.pull_request.base.sha || github.sha }}
          # bootstrap 的 G2 需要完整歷史。 / Bootstrap G2 requires full history.
          fetch-depth: 0
          persist-credentials: false
      - name: Set Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'
      - name: Install only evaluator dependencies
        working-directory: trusted
        run: python -I scripts/bootstrap.py
      - name: Install verified property-test tools / 安裝已驗證性質測試工具
        working-directory: trusted
        run: python -I scripts/install_test_tools.py
      - name: Offline security mutation checks
        working-directory: trusted
        run: .venv/bin/python -I scripts/mutation_check.py
      - name: Retain mutation report
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ${{ github.event_name == 'workflow_dispatch' && 'manual-mutations' || 'trusted-mutations' }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: trusted/artifacts/
          retention-days: 7
          if-no-files-found: error

  attest-evidence:
    name: Attest evaluator-owned evidence
    needs: trusted-security-pilot
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
      id-token: write
      attestations: write
    steps:
      # 全新 runner 不取得候選檔案、evaluator 匯入或模型憑證。 / A fresh runner receives no candidate files, evaluator imports or model credentials.
      - name: Sign evaluator-owned evidence
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-name: ${{ github.event_name == 'workflow_dispatch' && 'manual-security' || 'trusted-security' }}-${{ github.run_id }}-${{ github.run_attempt }}
          subject-digest: sha256:${{ needs.trusted-security-pilot.outputs.evidence-digest }}

  security-completion:
    # 規則集採計最終工作，僅評估成功不足以放行。 / The ruleset counts this final job; evaluator success alone cannot satisfy it.
    name: ${{ github.event_name == 'workflow_dispatch' && 'manual-security-completion' || 'trusted-security-pilot' }}
    needs: [trusted-security-pilot, attest-evidence, mutation-tests]
    if: always()
    runs-on: ubuntu-24.04
    timeout-minutes: 2
    permissions: {}
    steps:
      - name: Require evaluator, attestation and mutation success
        env:
          EVALUATOR_RESULT: ${{ needs.trusted-security-pilot.result }}
          ATTESTATION_RESULT: ${{ needs.attest-evidence.result }}
          MUTATION_RESULT: ${{ needs.mutation-tests.result }}
        run: |
          test "$EVALUATOR_RESULT" = success
          test "$ATTESTATION_RESULT" = success
          test "$MUTATION_RESULT" = success
