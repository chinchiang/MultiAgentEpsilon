title = "Epsilon：預設規則與合成驗收標記 / Default rules plus synthetic acceptance canary"
[extend]
useDefault = true

[[rules]]
id = "epsilon-acceptance-canary"
description = "僅供驗證偵測與遮蔽的合成機密 / Synthetic secret used only to prove the adapter detects and redacts"
regex = '''VIBE_TEST_SECRET_[A-Za-z0-9]{32}'''
keywords = ["VIBE_TEST_SECRET_"]
